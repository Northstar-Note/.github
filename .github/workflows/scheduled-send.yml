name: 예약 발송 (10:00 KST)

# 매일 10:00 KST(=01:00 UTC)에 /admin/send 의 run-due 를 호출.
# 예약된 호(승인됨·미취소·시각 도래)만 발송된다. 예약 없으면 아무 일도 안 함.
# 필요 secret: ADMIN_KEY (레포 Settings → Secrets and variables → Actions)

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: {}

jobs:
  run-due:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger due sends
        run: |
          curl -fsS -X POST "https://northstar-note.pages.dev/admin/send?key=${{ secrets.ADMIN_KEY }}" \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data 'action=run-due'
          echo ""
