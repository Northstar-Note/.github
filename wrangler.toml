# Cloudflare Pages + Functions config for the newsletter site.
name = "northstar-note"
pages_build_output_dir = "."
compatibility_date = "2026-07-03"

# NOTE: D1 binding "DB" and secret "ADMIN_KEY" are configured in the
# Cloudflare dashboard (Workers & Pages → project → Settings), NOT here —
# a placeholder database_id would fail the Pages build. See SUBSCRIBE-SETUP.md.

[[d1_databases]]
binding = "DB"
database_name = "northstar-subscribers"
database_id = "b231c7f9-2fbf-4250-b94e-41b5a6346238"
