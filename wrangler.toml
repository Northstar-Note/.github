# Cloudflare Pages + Functions config for the newsletter site.
name = "northstar-note"
pages_build_output_dir = "."
compatibility_date = "2026-07-03"

# NOTE: D1 binding "DB" and plaintext var "ADMIN_KEY" are configured in the
# Cloudflare dashboard (Workers & Pages → project → Settings), NOT here.
# IMPORTANT: keep all bindings/vars in the dashboard, none here. If a
# [[d1_databases]] block lives in this file, Pages reads config from here and
# IGNORES dashboard plaintext env vars — which silently drops ADMIN_KEY and
# breaks /admin (401 for every key). See SUBSCRIBE-SETUP.md.
